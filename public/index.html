<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <section class="card">

            <div class="header">
                <h1>Criar cadastro</h1>
                <p>Preencha seus dados abaixo</p>
            </div>

            <form id="formCadastro">

                <h2>Dados pessoais</h2>

                <div class="grid">

                    <div class="campo campo-full">
                        <label for="nome">Nome completo</label>
                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            placeholder="Digite seu nome completo"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="cpf">CPF</label>
                        <input
                            type="text"
                            id="cpf"
                            name="cpf"
                            placeholder="000.000.000-00"
                            maxlength="14"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="telefone">Telefone</label>
                        <input
                            type="tel"
                            id="telefone"
                            name="telefone"
                            placeholder="(00) 00000-0000"
                            maxlength="15"
                            required
                        >
                    </div>

                    <div class="campo campo-full">
                        <label for="email">E-mail</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="seu@email.com"
                            required
                        >
                    </div>

                </div>

                <h2>Endereço</h2>

                <div class="grid">

                    <div class="campo">
                        <label for="cep">CEP</label>

                        <div class="cep-wrapper">
                            <input
                                type="text"
                                id="cep"
                                name="cep"
                                placeholder="00000-000"
                                maxlength="9"
                                required
                            >

                            <span id="cepStatus"></span>
                        </div>
                    </div>

                    <div class="campo">
                        <label for="estado">Estado</label>
                        <input
                            type="text"
                            id="estado"
                            name="estado"
                            readonly
                        >
                    </div>

                    <div class="campo campo-full">
                        <label for="cidade">Cidade</label>
                        <input
                            type="text"
                            id="cidade"
                            name="cidade"
                            readonly
                        >
                    </div>

                    <div class="campo campo-full">
                        <label for="logradouro">Logradouro</label>
                        <input
                            type="text"
                            id="logradouro"
                            name="logradouro"
                            placeholder="Rua, avenida..."
                        >
                    </div>

                    <div class="campo">
                        <label for="numero">Número</label>
                        <input
                            type="text"
                            id="numero"
                            name="numero"
                            placeholder="Número"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="complemento">Complemento</label>
                        <input
                            type="text"
                            id="complemento"
                            name="complemento"
                            placeholder="Apto, bloco..."
                        >
                    </div>

                    <div class="campo campo-full">
                        <label for="bairro">Bairro</label>
                        <input
                            type="text"
                            id="bairro"
                            name="bairro"
                            readonly
                        >
                    </div>

                </div>

                <div id="mensagem" class="mensagem"></div>

                <button type="submit" id="btnCadastrar">
                    Cadastrar
                </button>

            </form>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
